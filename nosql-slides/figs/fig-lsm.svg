<rect x="60.0" y="396.0" width="760.0" height="58.0" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<rect x="60.0" y="396.0" width="5.0" height="58.0" rx="2" fill="#0f766e" stroke="#0f766e" stroke-width="0"/>

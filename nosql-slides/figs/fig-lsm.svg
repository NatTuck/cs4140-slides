<text x="78.0" y="328.0" text-anchor="start" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="15" fill="#b45309" font-weight="700">A read for k7 has to look in four places</text>

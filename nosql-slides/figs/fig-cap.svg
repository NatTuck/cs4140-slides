<text x="290.0" y="326.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="13" fill="#b45309" font-weight="700">CP</text>
<rect x="510.0" y="250.0" width="280.0" height="96.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="650.0" y="280.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="14" fill="#0f766e" font-weight="700">answer, possibly stale</text>
<text x="650.0" y="304.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="11" fill="#111827">available, and inconsistent</text>
<text x="650.0" y="326.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="13" fill="#0f766e" font-weight="700">AP</text>
<line x1="220.0" y1="178.0" x2="220.0" y2="246.0" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="720.0" y1="178.0" x2="720.0" y2="246.0" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5,4"/>
<rect x="60.0" y="362.0" width="820.0" height="37.0" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<rect x="60.0" y="362.0" width="5.0" height="37.0" rx="2" fill="#0f766e" stroke="#0f766e" stroke-width="0"/>
<text x="78.0" y="382.0" text-anchor="start" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="15" fill="#111827">That is the whole theorem: during a partition you cannot have both. Path A of the fork is AP; Path B is CP.</text>

<rect width="940" height="440" fill="#ffffff"/>
<text x="40.0" y="42.0" text-anchor="start" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="15" fill="#6b7280">During a partition, each side must answer somehow</text>
<rect x="90.0" y="80.0" width="260.0" height="96.0" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="220.0" y="116.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="15" fill="#0f766e" font-weight="700">node 1</text>
<text x="220.0" y="140.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="11" fill="#6b7280">has the row</text>
<rect x="590.0" y="80.0" width="260.0" height="96.0" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="720.0" y="116.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="15" fill="#0f766e" font-weight="700">node 2</text>
<text x="720.0" y="140.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="11" fill="#6b7280">has the other copy</text>
<path d="M 360 128 L 400 128" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="5,4"/>
<path d="M 540 128 L 580 128" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="5,4"/>
<path d="M 420 96 L 444 160 L 470 96 L 496 160" fill="none" stroke="#b91c1c" stroke-width="2.4"/>
<text x="470.0" y="76.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="13" fill="#b91c1c" font-weight="700">the partition</text>
<text x="470.0" y="184.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="11" fill="#6b7280">P is not a knob you set</text>
<text x="470.0" y="200.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="11" fill="#6b7280">it is a property of the network</text>

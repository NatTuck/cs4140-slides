<text x="290.0" y="280.0" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', Verdana, sans-serif" font-size="14" fill="#b45309" font-weight="700">refuse the request</text>
